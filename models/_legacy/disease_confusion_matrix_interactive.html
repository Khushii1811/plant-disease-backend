  const n = data.classes.length;
  
  let totalSupport = 0;
  let totalCorrect = 0;
  
  for (let i = 0; i < n; i++) {
    totalSupport += data.support[i];
    totalCorrect += data.matrix[i][i];
  }
  const cropAcc = totalSupport > 0 ? (totalCorrect / totalSupport * 100).toFixed(2) : '100.0';
  
  document.getElementById('statsBanner').innerHTML = `
    <div class="stat-pill">Crop: <b>${crop}</b></div>
    <div class="stat-pill">Pathology Classes: <b>${n}</b></div>
    <div class="stat-pill">Test Support: <b>${totalSupport} leaves</b></div>
    <div class="stat-pill">Within-Crop Accuracy: <b>${cropAcc}%</b> (${totalCorrect}/${totalSupport})</div>
  `;
  
  let html = '<table><thead><tr><th>True \ Pred</th>';
  for (let j = 0; j < n; j++) {
    html += `<th>${data.clean_names[j]}</th>`;
  }
  html += '<th>Support</th><th>Recall %</th></tr></thead><tbody>';
  
  for (let i = 0; i < n; i++) {
    html += `<tr><td class="row-hdr">${data.clean_names[i]}</td>`;
    const rowSup = data.support[i];
    const diagVal = data.matrix[i][i];
    
    for (let j = 0; j < n; j++) {
      const val = data.matrix[i][j];
      if (i === j) {
        const recPct = rowSup > 0 ? (diagVal / rowSup * 100).toFixed(1) : '100.0';
        const clsName = recPct >= 95 ? 'diag-perfect' : 'diag';
        html += `<td class="${clsName}">${val}<br><span style="font-size:10px;">(${recPct}%)</span></td>`;
      } else if (val > 0) {
        html += `<td class="err">${val}</td>`;
      } else {
        html += `<td class="zero">0</td>`;
      }
    }
    const rowRec = rowSup > 0 ? (diagVal / rowSup * 100).toFixed(1) : '100.0';
    html += `<td><b>${rowSup}</b></td><td><b>${rowRec}%</b></td></tr>`;
  }
  
  html += '</tbody></table>';
  document.getElementById('matrixContainer').innerHTML = html;
}

// Initial render
renderCropMatrix();
</script>
</body>
</html>
