[project]
name = "plant-disease-backend"
version = "1.0.0"
description = "DualHead ConvNeXt-Tiny Botanical Leaf Disease Classification Engine"
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "cleanvision>=0.3.7",
    "datasets>=3.0.0",
    "fastapi>=0.115.0",
    "imagehash>=4.3.2",
    "matplotlib>=3.7.0",
    "mlflow>=2.15.0",
    "modal>=1.6.4",
    "numpy>=1.24.0",
    "onnxruntime>=1.24.3",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "rembg>=2.0.69",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tqdm>=4.65.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "ipykernel>=6.29.0",
    "opencv-python-headless>=4.8.0",
    "psutil>=5.9.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "archive",
    "audit_output",
    "data",
    "notebooks",
    "scratch",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E402", "F401"]
